<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Center Ice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <!-- Resolve the theme before first paint, so dark-mode users don't see a white flash while the bundle loads. -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("ci-settings") || "{}"), m = s.lookV === 2 && s.mode ? s.mode : "dark";
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.setAttribute("data-theme", dark ? "dark" : "light");
        r.setAttribute("data-skin", s.skin === "classic" ? "classic" : "ice");
        r.setAttribute("data-palette", (s.lookV === 2 && s.palette) || "rink");
        r.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <noscript>Center Ice needs JavaScript.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
